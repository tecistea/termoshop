<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carrito de compras de termoshop.">
    <title>termoshop - Carrito</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="estilos.css?v=bd51c1a">

    <script src="js/config.js?v=bd51c1a" defer></script>
    <script src="js/api.js?v=bd51c1a" defer></script>
    <script src="js/utils.js?v=bd51c1a" defer></script>
    <script src="js/toast.js?v=bd51c1a" defer></script>
    <script src="js/nav.js?v=bd51c1a" defer></script>
    <script src="js/sesion.js?v=bd51c1a" defer></script>
    <script src="js/footer.js?v=bd51c1a" defer></script>
    <script src="js/carrito.js?v=bd51c1a" defer></script>
</head>
<body>

    <header class="cabecera">
        <nav class="nav" aria-label="Navegación principal">
            <a href="index.html" class="nav__logo">termoshop</a>
            <button type="button" class="nav__toggle" aria-label="Abrir menú"
                    aria-expanded="false" aria-controls="nav-menu">
                <span class="nav__toggle-barra"></span>
                <span class="nav__toggle-barra"></span>
                <span class="nav__toggle-barra"></span>
            </button>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__lista">
                    <li><a href="index.html" class="nav__link">Inicio</a></li>
                    <li><a href="index.html#catalogo" class="nav__link">Catálogo</a></li>
                    <li><a href="contacto.html" class="nav__link">Contacto</a></li>
                </ul>
                <div class="nav__sesion" id="nav-sesion"></div>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="seccion">
            <h1 class="seccion__titulo">Tu carrito</h1>

            <!-- Lista de items: la rellena carrito.js -->
            <div id="carrito-lista"></div>

            <p class="carrito__total" id="carrito-total"></p>

            <button type="button" id="btn-checkout" class="btn btn--primario btn--grande form__boton" hidden>
                <svg class="icono icono--check" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
                <span>Finalizar compra</span>
            </button>

            <p id="carrito-mensaje" class="form__exito" hidden></p>
        </section>
    </main>

    <!-- Footer unico inyectado por js/footer.js -->
    <footer class="pie" id="pie"></footer>

</body>
</html>
