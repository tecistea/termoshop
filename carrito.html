<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Carrito de compras de termoshop.">
    <title>termoshop - Carrito</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="estilos.css">

    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/sesion.js" defer></script>
    <script src="js/carrito.js" defer></script>
</head>
<body>

    <header class="cabecera">
        <nav class="nav" aria-label="Navegacion principal">
            <a href="index.html" class="nav__logo">termoshop</a>
            <ul class="nav__lista">
                <li><a href="index.html" class="nav__link">Inicio</a></li>
                <li><a href="index.html#catalogo" class="nav__link">Catalogo</a></li>
            </ul>
            <div class="nav__sesion" id="nav-sesion"></div>
        </nav>
    </header>

    <main class="main">
        <section class="seccion">
            <h1 class="seccion__titulo">Tu carrito</h1>

            <!-- Lista de items: la rellena carrito.js -->
            <div id="carrito-lista"></div>

            <p class="carrito__total" id="carrito-total"></p>

            <button type="button" id="btn-checkout" class="form__boton" hidden>
                Finalizar compra
            </button>

            <p id="carrito-mensaje" class="form__exito" hidden></p>
        </section>
    </main>

    <footer class="pie">
        <div class="pie__col">
            <h3 class="pie__titulo">termoshop</h3>
            <p>Termos premium en Argentina desde 2026.</p>
        </div>
    </footer>

</body>
</html>
