<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de administracion de productos de termoshop.">
    <title>termoshop - Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="estilos.css?v=be3ddce">

    <script src="js/config.js?v=be3ddce" defer></script>
    <script src="js/api.js?v=be3ddce" defer></script>
    <script src="js/utils.js?v=be3ddce" defer></script>
    <script src="js/toast.js?v=be3ddce" defer></script>
    <script src="js/nav.js?v=be3ddce" defer></script>
    <script src="js/sesion.js?v=be3ddce" defer></script>
    <script src="js/footer.js?v=be3ddce" defer></script>
    <script src="js/admin.js?v=be3ddce" defer></script>
</head>
<body>

    <header class="cabecera">
        <nav class="nav" aria-label="Navegacion principal">
            <a href="index.html" class="nav__logo">termoshop</a>
            <button type="button" class="nav__toggle" aria-label="Abrir menu"
                    aria-expanded="false" aria-controls="nav-menu">
                <span class="nav__toggle-barra"></span>
                <span class="nav__toggle-barra"></span>
                <span class="nav__toggle-barra"></span>
            </button>
            <div class="nav__menu" id="nav-menu">
                <ul class="nav__lista">
                    <li><a href="index.html" class="nav__link">Inicio</a></li>
                    <li><a href="contacto.html" class="nav__link">Contacto</a></li>
                </ul>
                <div class="nav__sesion" id="nav-sesion"></div>
            </div>
        </nav>
    </header>

    <main class="main">
        <section class="seccion">
            <h1 class="seccion__titulo">Panel de administracion</h1>
            <p class="seccion__intro">Gestion de productos del catalogo. Solo administradores.</p>

            <!-- ====== FORMULARIO DE ALTA / EDICION ======
                 El mismo form sirve para crear y editar. Cuando se edita, JS
                 guarda el id en data-editando; al guardar decide POST o PATCH. -->
            <form id="form-producto" class="form" novalidate>
                <h2 class="form__titulo" id="form-producto-titulo">Nuevo producto</h2>

                <div class="form__campo">
                    <label for="p-nombre" class="form__label">Nombre</label>
                    <input type="text" id="p-nombre" class="form__input" required>
                </div>
                <div class="form__campo">
                    <label for="p-marca" class="form__label">Marca</label>
                    <input type="text" id="p-marca" class="form__input">
                </div>
                <div class="form__campo">
                    <label for="p-capacidad" class="form__label">Capacidad</label>
                    <input type="text" id="p-capacidad" class="form__input" placeholder="Ej: 1000 ml">
                </div>
                <div class="form__campo">
                    <label for="p-material" class="form__label">Material</label>
                    <input type="text" id="p-material" class="form__input">
                </div>
                <div class="form__campo">
                    <label for="p-precio" class="form__label">Precio (ARS)</label>
                    <input type="number" id="p-precio" class="form__input" required min="0" step="1">
                </div>
                <div class="form__campo">
                    <label for="p-stock" class="form__label">Stock</label>
                    <input type="number" id="p-stock" class="form__input" required min="0" step="1">
                </div>
                <div class="form__campo">
                    <label for="p-badge" class="form__label">Badge</label>
                    <select id="p-badge" class="form__input">
                        <option value="">Sin badge</option>
                        <option value="NUEVO">NUEVO</option>
                        <option value="OFERTA">OFERTA</option>
                    </select>
                </div>
                <div class="form__campo">
                    <label for="p-imagen" class="form__label">Imagen (ruta o URL)</label>
                    <input type="text" id="p-imagen" class="form__input" placeholder="productos-imagenes/...webp">
                </div>
                <div class="form__campo">
                    <label for="p-descripcion" class="form__label">Descripcion</label>
                    <textarea id="p-descripcion" class="form__input form__input--textarea" rows="3"></textarea>
                </div>

                <div class="admin__acciones">
                    <button type="submit" class="btn btn--primario btn--grande form__boton">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn btn--secundario" hidden>Cancelar edicion</button>
                </div>
                <p id="admin-mensaje" class="form__exito" hidden></p>
            </form>

            <!-- ====== TABLA DE PRODUCTOS ======
                 La rellena admin.js. Acciones (editar / borrar) por fila usan
                 data-id y un listener delegado en el <tbody>. -->
            <h2 class="form__titulo">Productos</h2>
            <div class="admin__tabla-scroll">
                <table class="admin__tabla">
                    <thead>
                        <tr>
                            <th>ID</th><th>Nombre</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-tbody"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Footer unico inyectado por js/footer.js -->
    <footer class="pie" id="pie"></footer>

</body>
</html>
