<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ingreso y registro de usuarios de termoshop.">
    <title>termoshop - Ingresar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="estilos.css">

    <!-- Orden: config -> api -> sesion -> login -->
    <script src="js/config.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/sesion.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>

    <header class="cabecera">
        <nav class="nav" aria-label="Navegacion principal">
            <a href="index.html" class="nav__logo">termoshop</a>
            <ul class="nav__lista">
                <li><a href="index.html" class="nav__link">Inicio</a></li>
            </ul>
            <!-- Estado de sesion lo pinta sesion.js -->
            <div class="nav__sesion" id="nav-sesion"></div>
        </nav>
    </header>

    <main class="main main--auth">
        <section class="seccion seccion--auth">
            <h1 class="seccion__titulo">Acceder a termoshop</h1>

            <div class="auth__columnas">

                <!-- ====== LOGIN ====== -->
                <form id="form-login" class="form" novalidate>
                    <h2 class="form__titulo">Iniciar sesion</h2>

                    <div class="form__campo">
                        <label for="login-email" class="form__label">Email</label>
                        <input type="email" id="login-email" name="email" class="form__input"
                               placeholder="vos@ejemplo.com" required autocomplete="email">
                    </div>

                    <div class="form__campo">
                        <label for="login-password" class="form__label">Contrasena</label>
                        <input type="password" id="login-password" name="password" class="form__input"
                               placeholder="Tu contrasena" required minlength="6" autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn--primario btn--grande form__boton">Entrar</button>
                    <p id="login-mensaje" class="form__exito" hidden></p>
                </form>

                <!-- ====== REGISTRO ====== -->
                <form id="form-registro" class="form" novalidate>
                    <h2 class="form__titulo">Crear cuenta</h2>

                    <div class="form__campo">
                        <label for="reg-email" class="form__label">Email</label>
                        <input type="email" id="reg-email" name="email" class="form__input"
                               placeholder="vos@ejemplo.com" required autocomplete="email">
                    </div>

                    <div class="form__campo">
                        <label for="reg-password" class="form__label">Contrasena</label>
                        <input type="password" id="reg-password" name="password" class="form__input"
                               placeholder="Minimo 6 caracteres" required minlength="6" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn--primario btn--grande form__boton">Registrarme</button>
                    <p id="reg-mensaje" class="form__exito" hidden></p>
                </form>

            </div>
        </section>
    </main>

    <footer class="pie">
        <div class="pie__col">
            <h3 class="pie__titulo">termoshop</h3>
            <p>Termos premium en Argentina desde 2026.</p>
        </div>
    </footer>

</body>
</html>
